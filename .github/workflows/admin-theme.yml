name: Admin theme

# Self-hosted on wagtail-ci for trusted refs. Fork PRs stay on ubuntu-latest
# (public repo + persistent runner).

on:
  workflow_dispatch:
  push:
    paths:
      - "admin_theme/**"
      - "scripts/build_admin_theme.py"
      - "requirements.txt"
      - "config/settings.py"
      - ".github/workflows/admin-theme.yml"
  pull_request:
    paths:
      - "admin_theme/**"
      - "scripts/build_admin_theme.py"
      - "requirements.txt"
      - "config/settings.py"
      - ".github/workflows/admin-theme.yml"

permissions:
  contents: read

concurrency:
  group: admin-theme-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  admin-theme:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","wagtail-ci"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned design-system SHA
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < admin_theme/DESIGN_SYSTEM_SHA)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aavendano/plt-design-system
          ref: ${{ steps.pin.outputs.sha }}
          path: plt-design-system
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stylesheet is up to date with the pinned design system
        run: python scripts/build_admin_theme.py --design-system plt-design-system --check
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Pytest admin_theme
        run: .venv/bin/python -m pytest admin_theme/tests -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
