{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop Manager</title>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% if messages %}
    <div id="django-messages" hidden>
        {% for message in messages %}
        <span data-content="{{ message|escape }}"
            data-error="{% if message.tags == 'error' %}1{% else %}0{% endif %}"></span>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}

    <script defer
        src="{{ request.scheme }}://{{ request.META.HTTP_HOST }}{% static 'core/js/messages_manager.js' %}?v=20251112b"></script>
</body>

</html>
